<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Arquivo dos Caçadores</title>
    <h1>REGISTRO DE CAÇADA - BESTIÁRIO</h1>

    <style>
      body { font-family: Arial, sans-serif; margin: 40px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 3px solid #ccc; padding: 10px; text-align: center; }
      th { background: #f0f0f0; }
    </style>
  </head>
  <body>

    <div id="mensagem"></div>

    <h2 id="titulo-form">Novo registro</h2>
    <form id="form-registro">
      <input type="hidden" id="id_criatura">
      <label>Nome <input type="text" id="nome" required></label>
      <label>Localização <input type="text" id="localizacao" required></label>
      <label>Ecos <input type="number" id="ecos" required></label>
      <label>Fraqueza <input type="number" id="id_fraqueza" required></label>
      <label>Status <input type="number" id="id_status" required></label>
      <div class="botoes">
        <button type="submit" id="btn-salvar">Salvar</button>
      </div>
    </form>

    <h2>Pesquisar registro</h2>
    <form id="form-pesquisa" onsubmit="pesquisar(event)">
      <label>Nome
        <input type="text" id="pesquisa">
      </label>
      <button type="submit">Pesquisar</button>
      <button type="button" onclick="limparPesquisa()">
        Limpar
      </button>
    </form>

    <h1>Lista de Registros</h1>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Localização</th>
          <th>Ecos</th>
          <th>Fraqueza</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="bestiario"></tbody>
    </table>

    <script>

      async function carregarRegistro() {
        const tbody = document.getElementById('bestiario');
        const pesquisa = document.getElementById('pesquisa').value;

        try {
          const resposta = await fetch('/api/registros?pesquisa=' + encodeURIComponent(pesquisa));
          const registros = await resposta.json();

          if (!resposta.ok) {
            throw new Error(registros.erro);
          }

          listaBestiario = registros;

          if (registros.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="8">Nenhum registro encontrado.</td></tr>';
            return;
          }

          tbody.innerHTML = registros.map(b => `
            <tr>
              <td>${b.id_criatura}</td>
              <td>${b.nome_besta}</td>
              <td>${b.localizacao}</td>
              <td>${b.ecos}</td>
              <td>${b.nome_fraqueza}</td>
              <td>${b.nome_status}</td>
              <td><button onclick="editarAluno(${b.id_criatura})">Editar</button> <button onclick="deletarRegistro(${b.id_criatura})">Deletar</button></td>
            </tr>`).join('');

        } catch (erro) {
          tbody.innerHTML = `<tr><td colspan="8">${erro.message}</td></tr>`;
        }
      }

      let listaBestiario = [];

      carregarRegistro();

      function editarRegistro(id) {
        const a = listaBestiario.find(bestiario => bestiario.id_criatura == id);

        document.getElementById('id_criatura').value = b.id_criatura;
        document.getElementById('nome').value = b.nome_besta;
        document.getElementById('localizacao').value = b.localizacao;
        document.getElementById('ecos').value = b.ecos;
        document.getElementById('id_fraqueza').value = b.id_fraqueza;
        document.getElementById('id_status').value = b.id_fraqueza;
        window.scrollTo(0, 0);
      }

      async function deletarRegistro(id) {
        if (!confirm('Deseja realmente deletar este registro?')){
          return;
        }

        const resposta = await fetch(`/api/registros/${id}`, {
          method: "DELETE"
        });
        const resultado = await resposta.json();

        if (resposta.ok) {
          alert("Registro excluído!");
          carregarRegistro();
        } 
        
        else {
          alert("Erro ao excluir registro.");
        }
      }

      function pesquisar(evento) {
        evento.preventDefault();
        carregarRegistro();
      }

      function limparPesquisa() {
        document.getElementById('pesquisa').value = '';
        carregarRegistro();
      }

      document.getElementById('form-registro').addEventListener('submit', async (evento) => {
        evento.preventDefault();

        const id = document.getElementById('id_criatura').value;

        const bestiario = {
          nome: document.getElementById('nome').value,
          localizacao: document.getElementById('localizacao').value,
          ecos: document.getElementById('ecos').value,
          id_fraqueza: document.getElementById('id_fraqueza').value,
          id_status: document.getElementById('id_status').value,
        };

        const metodo = id ? 'PUT' : 'POST';
        const endereco = id ? '/api/registros/' + id : '/api/registros';

        const resposta = await fetch(endereco, {
          method: metodo,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bestiario)
        });

        const resultado = await resposta.json();

        document.getElementById('mensagem').textContent =
          resultado.mensagem ?? resultado.erro;

        if (resposta.ok) {
          document.getElementById('form-registro').reset();
          document.getElementById('id_criatura').value = '';
          document.getElementById('titulo-form').textContent = 'Novo registro';
          carregarRegistro();
        }
    });
    </script>

  </body>
</html>
